name: Lint and validate

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # - name: Run lint
      #   run: npm run lint

      # - name: Validate types
      #   run: npm run validate-types

      - name: Run tests
        run: npm test
